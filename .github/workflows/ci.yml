name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Dummy env vars for build-time validation (no real secrets in CI)
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sahabatkreator
  BETTER_AUTH_SECRET: dummy-secret-for-ci-build-only-32chars
  BETTER_AUTH_URL: http://localhost:3001
  CORS_ORIGIN: http://localhost:3000
  VAPID_PRIVATE_KEY: dummy-vapid-private-key-for-build
  VAPID_PUBLIC_KEY: dummy-vapid-public-key-for-build
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  NODE_ENV: production

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx @biomejs/biome check apps/web/src apps/server/src apps/worker/src packages

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Test
        run: bun run test
