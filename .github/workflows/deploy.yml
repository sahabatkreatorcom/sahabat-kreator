name: Deploy to VPS

on:
  workflow_run:
    workflows: ["Build Docker Images"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main')

    strategy:
      matrix:
        environment:
          - production
          - staging
      fail-fast: false

    steps:
      - name: Deploy to ${{ matrix.environment }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.environment == 'production' && secrets.PRODUCTION_VPS_HOST || secrets.STAGING_VPS_HOST }}
          username: ${{ matrix.environment == 'production' && secrets.PRODUCTION_VPS_USER || secrets.STAGING_VPS_USER }}
          key: ${{ matrix.environment == 'production' && secrets.PRODUCTION_VPS_SSH_KEY || secrets.STAGING_VPS_SSH_KEY }}
          port: ${{ matrix.environment == 'production' && secrets.PRODUCTION_VPS_PORT || secrets.STAGING_VPS_PORT }}
          script: |
            cd /opt/sahabat-kreator

            # Pull latest code (optional, only needed for env files and docker-compose)
            git pull || true

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull postgres and redis images (these don't change)
            docker pull postgres:16-alpine || true
            docker pull redis:7-alpine || true

            # Pull application images from GitHub Container Registry
            docker pull ghcr.io/${{ env.IMAGE_NAME }}/server:latest || \
            docker pull ghcr.io/${{ env.IMAGE_NAME }}/server:${{ github.sha }} || true
            
            docker pull ghcr.io/${{ env.IMAGE_NAME }}/worker:latest || \
            docker pull ghcr.io/${{ env.IMAGE_NAME }}/worker:${{ github.sha }} || true
            
            docker pull ghcr.io/${{ env.IMAGE_NAME }}/web:latest || \
            docker pull ghcr.io/${{ env.IMAGE_NAME }}/web:${{ github.sha }} || true

            # Tag pulled images with expected names
            docker tag ghcr.io/${{ env.IMAGE_NAME }}/server:latest sahabatkreator/server:latest 2>/dev/null || true
            docker tag ghcr.io/${{ env.IMAGE_NAME }}/worker:latest sahabatkreator/worker:latest 2>/dev/null || true
            docker tag ghcr.io/${{ env.IMAGE_NAME }}/web:latest sahabatkreator/web:latest 2>/dev/null || true

            # Stop old containers
            docker compose -f docker-compose.prod.yml down || true

            # Create volumes directory
            sudo mkdir -p uploads

            # Start containers (no --build, use pulled images)
            docker compose --env-file .env.production.local -f docker-compose.prod.yml up -d

            # Health check
            echo "Waiting for services to be healthy..."
            for i in {1..60}; do
              if docker exec sk_server curl -sf http://localhost:3001/health > /dev/null 2>&1; then
                echo "Server is healthy!"
                break
              fi
              sleep 5
            done

            # Show status
            docker compose -f docker-compose.prod.yml ps

            # Show latest logs
            docker compose -f docker-compose.prod.yml logs --tail=50 server
