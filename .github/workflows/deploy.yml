name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SHA: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main')

    strategy:
      matrix:
        environment:
          - production
      fail-fast: false

    steps:
      - name: Deploy to ${{ matrix.environment }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_VPS_HOST }}
          username: ${{ secrets.PRODUCTION_VPS_USER }}
          key: ${{ secrets.PRODUCTION_VPS_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_VPS_PORT }}
          script: |
            cd /opt/sahabat-kreator

            # Fix git safe directory
            git config --global --add safe.directory /opt/sahabat-kreator

            # Pull latest code (for docker-compose and env files)
            git pull || true

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull postgres and redis images
            docker pull postgres:16-alpine || true
            docker pull redis:7-alpine || true

            # Pull application images from GitHub Container Registry
            docker pull ghcr.io/sahabatkreatorcom/sahabat-kreator/server:latest || true
            docker pull ghcr.io/sahabatkreatorcom/sahabat-kreator/worker:latest || true
            docker pull ghcr.io/sahabatkreatorcom/sahabat-kreator/web:latest || true

            # Stop old containers
            docker compose -f docker-compose.prod.yml down || true

            # Create volumes directory
            sudo mkdir -p uploads

            # Start containers (no --build, use pulled images)
            docker compose --env-file .env.production.local -f docker-compose.prod.yml up -d

            # Health check
            echo "Waiting for services to be healthy..."
            for i in {1..60}; do
              if docker exec sk_server curl -sf http://localhost:3001/health > /dev/null 2>&1; then
                echo "Server is healthy!"
                break
              fi
              sleep 5
            done

            # Show status
            docker compose -f docker-compose.prod.yml ps

            # Show latest logs
            docker compose -f docker-compose.prod.yml logs --tail=50 server
