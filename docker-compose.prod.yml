# Sahabat Kreator — Production Docker Compose
# ============================================
# Mode: Multi-container production deployment
# Stack: PostgreSQL + Redis + Server + Worker + Web
#
# Usage:
#   # Deploy from local build (default)
#   docker compose -f docker-compose.prod.yml up -d
#
#   # Deploy from GHCR (CI-pushed images)
#   GITHUB_IMAGE=true docker compose -f docker-compose.prod.yml pull --ignore-cache
#   docker compose -f docker-compose.prod.yml up -d
#
#   # Or via deploy.sh (automatically pulls from GHCR)
#   ./deploy.sh production
#
# Environment:
#   GITHUB_TOKEN  - Required when deploying from GHCR (set in .env.production.local)
#   IMAGE_REGISTRY - GHCR registry URL (default: ghcr.io/sahabatkreatorcom/sahabat-kreator)
#
# Note: Nginx is handled externally (see nginx config in repo root).
# This compose file runs on the same host as nginx.
# Nginx proxies to port 8080 (web) and 8081 (server).
#
# DOMAIN: app.sahabatkreator.com (primary) → api.app.sahabatkreator.com
#
# PORT USAGE (check before deploying):
#   8080 (Web), 8081 (Server) - NEW ports for this stack
#   Existing: 3000-3002, 3100, 3200, 5432, 6379 may be in use by other projects
#
# Environment file: .env.production.local (DO NOT COMMIT TO GIT)
# Copy from .env.production.local.example and fill in real values

services:
  postgres:
    image: postgres:16-alpine
    container_name: sk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-sahabatkreator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sk-network

  redis:
    image: redis:7-alpine
    container_name: sk_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sk-network

  server:
    image: ${IMAGE_REGISTRY:-ghcr.io/sahabatkreatorcom/sahabat-kreator}/server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: server-production
    container_name: sk_server
    restart: unless-stopped
    ports:
      - "8081:3001"
    environment:
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-sahabatkreator}
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.app.sahabatkreator.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.sahabatkreator.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.sahabatkreator.com}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.app.sahabatkreator.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      SUMOPOD_API_SECRET: ${SUMOPOD_API_SECRET:-}
      SUMOPOD_WEBHOOK_SECRET: ${SUMOPOD_WEBHOOK_SECRET:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sk-network
    volumes:
      - ./uploads:/app/uploads

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/sahabatkreatorcom/sahabat-kreator}/worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: sk_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-sahabatkreator}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.sahabatkreator.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sahabatkreator.com}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SK_MODEL: ${SK_MODEL:-}
      SK_SYSTEM_PROMPT_OVERRIDE: ${SK_SYSTEM_PROMPT_OVERRIDE:-}
      SK_TEMPERATURE: ${SK_TEMPERATURE:-}
      SK_MAX_REPORTS_PER_DAY: ${SK_MAX_REPORTS_PER_DAY:-10}
      SK_MAX_CHATS_PER_DAY: ${SK_MAX_CHATS_PER_DAY:-50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sk-network

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/sahabatkreatorcom/sahabat-kreator}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sk_web
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      # Database & Auth (needed for SSR)
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-sahabatkreator}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.app.sahabatkreator.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.sahabatkreator.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.sahabatkreator.com}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.app.sahabatkreator.com}
      # VAPID Keys
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      # Runtime
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - server
    networks:
      - sk-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sk-network:
    driver: bridge
