# Sahabat Kreator — Production Docker Compose
# ============================================
# Mode: Multi-container production deployment
# Stack: PostgreSQL + Redis + Server + Worker + Web
#
# Usage:
#   cp .env.example .env.production
#   # Edit .env.production with real values
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml logs -f server
#
# Services:
#   - server     : Hono API server (port 8081)
#   - worker     : BullMQ job worker
#   - web        : Next.js frontend (port 8080)
#
# Note: Nginx is handled externally (see nginx config in repo root).
# This compose file runs on the same host as nginx.
# Nginx proxies to port 8080 (web) and 8081 (server).
#
# PORT USAGE (server already running):
#   3000, 3001, 3002, 3100, 3200 - IN USE
#   6379 (Redis), 5432 (Postgres) - IN USE
#   New ports: 8080 (Web), 8081 (Server)
#
# Environment file: .env.production.local (DO NOT COMMIT TO GIT)
# Copy from .env.production.local.example and fill in real values
# Docker Compose will auto-load .env if present

services:
  postgres:
    image: postgres:16-alpine
    container_name: sk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-sahabatkreator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sk-network

  redis:
    image: redis:7-alpine
    container_name: sk_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sk-network

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-production
    image: sahabatkreator/server:latest
    container_name: sk_server
    restart: unless-stopped
    ports:
      - "8081:3001"
    environment:
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-sahabatkreator}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.sahabatkreator.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://sahabatkreator.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://sahabatkreator.com}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.sahabatkreator.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SUMOPOD_API_KEY: ${SUMOPOD_API_KEY:-}
      SUMOPOD_API_SECRET: ${SUMOPOD_API_SECRET:-}
      SUMOPOD_WEBHOOK_SECRET: ${SUMOPOD_WEBHOOK_SECRET:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sk-network
    volumes:
      - ./uploads:/app/uploads

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sahabatkreator/worker:latest
    container_name: sk_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-sahabatkreator}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SK_MODEL: ${SK_MODEL:-}
      SK_SYSTEM_PROMPT_OVERRIDE: ${SK_SYSTEM_PROMPT_OVERRIDE:-}
      SK_TEMPERATURE: ${SK_TEMPERATURE:-}
      SK_MAX_REPORTS_PER_DAY: ${SK_MAX_REPORTS_PER_DAY:-10}
      SK_MAX_CHATS_PER_DAY: ${SK_MAX_CHATS_PER_DAY:-50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sk-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: sahabatkreator/web:latest
    container_name: sk_web
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://api.sahabatkreator.com}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - server
    networks:
      - sk-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sk-network:
    driver: bridge
