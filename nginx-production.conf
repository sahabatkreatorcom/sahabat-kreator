# Sahabat Kreator — Nginx Config (Production)
# =============================================================================
# Domain: sahabatkreator.com (PRODUCTION)
# Mode: Cloudflare Full/Full Strict SSL
# SSL: Cloudflare Origin Certificate
#
# Routing:
#   /                 → Web (Next.js, port 8080)
#   /api/*            → Server (Hono API, port 8081)
#
# PORT USAGE (server already running):
#   3000, 3001, 3002, 3100, 3200 - IN USE
#   New ports: 8080 (Web), 8081 (Server)
# =============================================================================


upstream web_upstream {
    server 127.0.0.1:8080;
}


upstream server_upstream {
    server 127.0.0.1:8081;
}


# ─── HTTP → HTTPS ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name www.sahabatkreator.com;
    return 301 https://sahabatkreator.com$request_uri;
}


server {
    listen 80;
    server_name sahabatkreator.com;
    return 301 https://sahabatkreator.com$request_uri;
}


# ─── HTTPS www → apex (301) ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.sahabatkreator.com;

    ssl_certificate     /etc/nginx/ssl/sahabatkreator/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/sahabatkreator/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    return 301 https://sahabatkreator.com$request_uri;
}


# ─── HTTPS apex → serve ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    server_name sahabatkreator.com;

    ssl_certificate     /etc/nginx/ssl/sahabatkreator/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/sahabatkreator/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Trust Cloudflare IPs
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    proxy_read_timeout 320s;
    proxy_send_timeout 320s;
    client_max_body_size 100M;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.sumopod.com https://openrouter.ai; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ─── API Routes → Server (Hono) ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Auth Callbacks → Server (Hono) ─────────────────────────────────────
    location /api/auth/ {
        proxy_pass http://server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Web App (Next.js) ───────────────────────────────────────────────────
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            proxy_pass http://web_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
